<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - لوحة تحكم المشرف (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto space-y-6 min-h-screen flex flex-col justify-between">

    <div class="space-y-6">
        <div class="flex justify-between items-center glass-card p-4 md:p-6">
            <h1 class="text-xl md:text-2xl font-bold text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-shield-dog"></i> لوحة تحكم المشرف (Admin)
            </h1>
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="text-xs bg-slate-800 text-slate-300 hover:text-white px-3 py-2 rounded-xl border border-slate-700 transition">لوحة المستخدم</a>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">خروج</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-5 space-y-2">
                <span class="text-xs text-slate-400 font-bold">إجمالي المستخدمين</span>
                <div class="text-3xl font-black text-emerald-400 font-mono" id="totalUsersCount">0</div>
            </div>
            <div class="glass-card p-5 space-y-2">
                <span class="text-xs text-slate-400 font-bold">طلبات الإيداع المعلقة</span>
                <div class="text-3xl font-black text-amber-400 font-mono" id="pendingDepositsCount">0</div>
            </div>
            <div class="glass-card p-5 space-y-2">
                <span class="text-xs text-slate-400 font-bold">طلبات السحب المعلقة</span>
                <div class="text-3xl font-black text-blue-400 font-mono" id="pendingWithdrawsCount">0</div>
            </div>
        </div>

        <div class="glass-card p-6 space-y-4">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-users"></i> إدارة المستخدمين وحظرهم/تنشيطهم
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="p-3">المعرف</th>
                            <th class="p-3">الاسم</th>
                            <th class="p-3">البريد الإلكتروني</th>
                            <th class="p-3">الرصيد</th>
                            <th class="p-3">الحالة</th>
                            <th class="p-3">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-slate-800">
                        <tr><td colspan="6" class="p-4 text-center text-slate-500">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-500 pt-4 border-t border-slate-800">
        Admin Panel &copy; 2026
    </footer>

    <script>
        const API_BASE = 'http://localhost:8081/ords/buysell_user';
        let currentUser = JSON.parse(sessionStorage.getItem('pf_user'));

        if (!currentUser || String(currentUser.role || currentUser.ROLE || '').toUpperCase() !== 'ADMIN') {
            alert('❌ غير مصرح لك بالدخول إلى هذه الصفحة!');
            window.location.href = 'dashboard.html';
        }

        async function loadAdminData() {
            try {
                const res = await fetch(`${API_BASE}/users/?_t=${new Date().getTime()}`);
                if (!res.ok) throw new Error('فشل جلب المستخدمين');
                const data = await res.json();
                const users = data.items || [];

                document.getElementById('totalUsersCount').innerText = users.length;

                let tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">لا يوجد مستخدمون</td></tr>';
                    return;
                }

                users.forEach(u => {
                    const id = u.id || u.ID;
                    const name = u.full_name || u.FULL_NAME || '-';
                    const email = u.email || u.EMAIL || '-';
                    const bal = parseFloat(u.balance !== undefined ? u.balance : (u.BALANCE || 0));
                    const active = u.is_active !== undefined ? u.is_active : u.IS_ACTIVE;

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3 font-mono">#${id}</td>
                        <td class="p-3 font-bold text-slate-200">${name}</td>
                        <td class="p-3 font-mono text-slate-300">${email}</td>
                        <td class="p-3 font-mono text-emerald-400">${bal.toFixed(2)} USDT</td>
                        <td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${active ? 'نشط' : 'مجمد'}</span></td>
                        <td class="p-3">
                            <button onclick="toggleUserStatus(${id}, ${active})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${active ? 'bg-red-500/10 text-red-400 hover:bg-red-500/20' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20'} transition">
                                ${active ? 'تجميد' : 'تنشيط'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleUserStatus(userId, currentActive) {
            try {
                const res = await fetch(`${API_BASE}/users/${userId}`);
                if (!res.ok) throw new Error('فشل جلب بيانات المستخدم');
                const u = await res.json();

                const newActive = (currentActive === 1 || currentActive === true) ? 0 : 1;

                await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "id": parseInt(userId),
                        "full_name": u.full_name || u.FULL_NAME,
                        "phone_number": u.phone_number || u.PHONE_NUMBER,
                        "email": u.email || u.EMAIL,
                        "password_hash": u.password_hash || u.PASSWORD_HASH,
                        "role": u.role || u.ROLE || "USER",
                        "kyc_status": u.kyc_status || u.KYC_STATUS || "PENDING",
                        "is_active": newActive,
                        "balance": parseFloat(u.balance !== undefined ? u.balance : (u.BALANCE || 0))
                    })
                });

                loadAdminData();
            } catch (e) {
                alert(`خطأ: ${e.message}`);
            }
        }

        function logout() {
            sessionStorage.removeItem('pf_user');
            window.location.href = 'login.html';
        }

        loadAdminData();
    </script>
</body>
</html>
