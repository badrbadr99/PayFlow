<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - طلب سحب أموال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #3b82f6; }
        .btn-blue { background: #3b82f6; color: white; font-weight: bold; padding: 14px; border-radius: 12px; width: 100%; transition: opacity 0.2s; font-size: 16px; }
        .btn-blue:hover { opacity: 0.9; }
        .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto min-h-screen flex flex-col justify-center space-y-6">

    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-arrow-up-right"></i> طلب سحب أموال
        </h1>
        <a href="dashboard.html" class="text-xs text-slate-300 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 transition">
            <i class="fa-solid fa-arrow-right"></i> رجوع
        </a>
    </div>

    <div class="glass-card p-6 md:p-8 space-y-5 shadow-2xl">
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
            <span class="text-slate-400">رصيدك المتاح حالياً:</span>
            <b id="userBalanceText" class="text-lg text-emerald-400 font-mono">0.00 USDT</b>
        </div>

        <form onsubmit="submitWithdraw(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">طريقة السحب</label>
                <select id="withdrawMethod" class="input-field font-bold text-blue-400" required>
                    <option value="USDT TRC20">USDT (TRC20)</option>
                    <option value="USDT BEP20">USDT (BEP20)</option>
                    <option value="بنك الكريمي">حساب بنك الكريمي</option>
                    <option value="جوالي / صرافة">تحويل صرافة محلي</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">رقم المحفظة / رقم الحساب / العنوان</label>
                <input type="text" id="destinationAddress" required class="input-field text-left font-mono" placeholder="أدخل عنوان المحفظة أو رقم الحساب" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">المبلغ المراد سحبه (USDT)</label>
                <input type="number" step="0.01" min="1" id="withdrawAmount" required class="input-field text-left font-mono text-lg text-blue-400" placeholder="0.00" dir="ltr">
            </div>

            <button type="submit" id="submitBtn" class="btn-blue flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> إرسال طلب السحب
            </button>
        </form>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/ords/buysell_user';
        let currentUser = JSON.parse(sessionStorage.getItem('pf_user'));

        if (!currentUser) window.location.href = 'login.html';

        async function initWithdraw() {
            const userId = currentUser.id || currentUser.ID;
            try {
                const res = await fetch(`${API_BASE}/users/${userId}?_t=${new Date().getTime()}`);
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data;
                    sessionStorage.setItem('pf_user', JSON.stringify(data));
                    const bal = parseFloat(data.balance !== undefined ? data.balance : (data.BALANCE || 0));
                    document.getElementById('userBalanceText').innerText = `${bal.toFixed(2)} USDT`;
                }
            } catch (e) {}
        }

        async function submitWithdraw(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const method = document.getElementById('withdrawMethod').value;
            const address = document.getElementById('destinationAddress').value.trim();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            const userId = currentUser.id || currentUser.ID;
            const currentBal = parseFloat(currentUser.balance !== undefined ? currentUser.balance : (currentUser.BALANCE || 0));

            if (amount > currentBal) {
                alert(`❌ رصيدك الحالي (${currentBal.toFixed(2)} USDT) لا يكفي لإتمام عملية السحب!`);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال طلب السحب...';

            try {
                const res = await fetch(`${API_BASE}/withdraw_requests/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "user_id": parseInt(userId),
                        "withdraw_method": method,
                        "destination_address": address,
                        "amount_usdt": amount,
                        "amount_local": amount * 560,
                        "status": "PENDING"
                    })
                });

                if (res.ok) {
                    alert('✅ تم إرسال طلب السحب بنجاح وسيتم مراجعته من الإدارة قريباً!');
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error('فشل تسجيل طلب السحب في الخادم');
                }

            } catch (err) {
                console.error('Withdraw Error:', err);
                alert(`❌ حدث خطأ أثناء إرسال طلب السحب: ${err.message || err}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال طلب السحب';
            }
        }

        initWithdraw();
    </script>
</body>
</html>
