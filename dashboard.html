<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto space-y-6 min-h-screen flex flex-col justify-between">

    <div class="space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center glass-card p-4 md:p-6">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-emerald-400" id="userName">مرحباً، ...</h1>
                <p class="text-xs text-slate-400" id="userEmail">...</p>
            </div>
            <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/20 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-500/20 transition flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </div>

        <!-- Balance Card -->
        <div class="glass-card p-6 md:p-8 bg-gradient-to-br from-slate-900 to-emerald-950/40 border-emerald-500/30 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">الرصيد المتاح</span>
                <div class="text-4xl md:text-5xl font-black text-emerald-400 font-mono mt-1" id="userBalance">0.00 USDT</div>
            </div>
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <a href="deposit.html" class="flex-1 md:flex-none px-5 py-3 bg-emerald-500 text-white font-bold rounded-xl text-center hover:bg-emerald-600 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wallet"></i> إيداع
                </a>
                <a href="withdraw.html" class="flex-1 md:flex-none px-5 py-3 bg-blue-600 text-white font-bold rounded-xl text-center hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-up-right"></i> سحب
                </a>
                <a href="transfer.html" class="flex-1 md:flex-none px-5 py-3 bg-purple-600 text-white font-bold rounded-xl text-center hover:bg-purple-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> تحويل
                </a>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <a href="kyc.html" class="glass-card p-5 hover:border-emerald-500 transition flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm">توثيق الحساب (KYC)</h3>
                        <p class="text-xs text-slate-400" id="kycStatusText">الحالة: قيد المراجعة</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left text-slate-500 text-sm"></i>
            </a>
            <div class="glass-card p-5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm">أمان الحساب</h3>
                        <p class="text-xs text-slate-400">الحساب محمي وآمن</p>
                    </div>
                </div>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold">نشط</span>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-500 pt-4 border-t border-slate-800">
        PayFlow Dashboard &copy; 2026
    </footer>

    <script>
        const API_BASE = 'http://localhost:8081/ords/buysell_user';
        let currentUser = JSON.parse(sessionStorage.getItem('pf_user'));

        if (!currentUser) {
            window.location.href = 'login.html';
        }

        function loadUserData() {
            const name = currentUser.full_name || currentUser.FULL_NAME || 'مستخدم PayFlow';
            const email = currentUser.email || currentUser.EMAIL || '';
            const balance = parseFloat(currentUser.balance !== undefined ? currentUser.balance : (currentUser.BALANCE || 0));
            const kyc = currentUser.kyc_status || currentUser.KYC_STATUS || 'PENDING';

            document.getElementById('userName').innerText = `مرحباً، ${name}`;
            document.getElementById('userEmail').innerText = email;
            document.getElementById('userBalance').innerText = `${balance.toFixed(2)} USDT`;

            const kycMap = { 'PENDING': 'قيد المراجعة', 'APPROVED': 'موثق', 'REJECTED': 'مرفوض' };
            document.getElementById('kycStatusText').innerText = `الحالة: ${kycMap[kyc] || kyc}`;
        }

        async function fetchLatestData() {
            const userId = currentUser.id || currentUser.ID;
            try {
                const res = await fetch(`${API_BASE}/users/${userId}?_t=${new Date().getTime()}`);
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data;
                    sessionStorage.setItem('pf_user', JSON.stringify(data));
                    loadUserData();
                }
            } catch (e) {}
        }

        function logout() {
            sessionStorage.removeItem('pf_user');
            window.location.href = 'login.html';
        }

        loadUserData();
        fetchLatestData();
    </script>
</body>
</html>
