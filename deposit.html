<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - طلب إيداع وتأكيد التحويل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; width: 100%; }
        .input-field:focus { border-color: #10b981; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="glass-card w-full max-w-lg p-6 md:p-8 space-y-6">
        
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-money-bill-wave"></i> طلب إيداع وتأكيد التحويل
            </h1>
            <button onclick="window.location.href='dashboard.html'" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                رجوع
            </button>
        </div>

        <form id="depositForm" onsubmit="submitDeposit(event)" class="space-y-5">
            
            <div>
                <label class="block text-sm text-slate-400 mb-2">اختر المحفظة المراد التحويل إليها</label>
                <select id="walletSelect" required class="input-field text-emerald-400 font-bold">
                    <option value="">جاري تحميل المحافظ...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-2">المبلغ بالريال اليمني (YER)</label>
                <input type="number" id="amountLocalInput" step="any" placeholder="مثلاً: 2000" required class="input-field text-lg font-bold">
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <span class="text-sm text-slate-400">الصافي المضاف بالـ USDT:</span>
                <span id="netUsdtDisplay" class="text-xl font-bold text-emerald-400">USDT 0.00</span>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-2">ارفق صورة إثبات التحويل / السند</label>
                <input type="file" id="proofInput" accept="image/*" required class="input-field text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-base">
                <i class="fa-solid fa-paper-plane"></i> إرسال طلب الإيداع
            </button>

        </form>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/ords/buysell_user';
        const currentUser = JSON.parse(sessionStorage.getItem('pf_user'));

        if (!currentUser) {
            alert('يرجى تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        }

        let currentBuyRate = 560;

        async function loadExchangeRate() {
            try {
                const res = await fetch(`${API_BASE}/exchange_rates/`);
                if (res.ok) {
                    const data = await res.json();
                    const items = data.items || [];
                    if (items.length > 0) {
                        const r = items[0];
                        const liveRate = parseFloat(r.buy_rate || r.BUY_RATE || r.rate_usdt_to_yer || r.RATE_USDT_TO_YER);
                        if (!isNaN(liveRate) && liveRate > 0) {
                            currentBuyRate = liveRate;
                            calculateNetUsdt();
                        }
                    }
                }
            } catch (e) {}
        }

        function calculateNetUsdt() {
            const amountInput = document.getElementById('amountLocalInput');
            const netDisplay = document.getElementById('netUsdtDisplay');
            const amount = parseFloat(amountInput.value) || 0;

            if (amount > 0 && currentBuyRate > 0) {
                const net = amount / currentBuyRate;
                netDisplay.textContent = `USDT ${net.toFixed(2)}`;
            } else {
                netDisplay.textContent = 'USDT 0.00';
            }
        }

        async function loadWallets() {
            const walletSelect = document.getElementById('walletSelect');
            try {
                const res = await fetch(`${API_BASE}/payment_methods/`);
                if (res.ok) {
                    const data = await res.json();
                    const items = data.items || [];
                    if (items.length === 0) {
                        walletSelect.innerHTML = '<option value="">لا توجد محافظ مجهزة حالياً</option>';
                        return;
                    }
                    walletSelect.innerHTML = items.map(m => {
                        const id = m.id || m.ID;
                        const name = m.method_name || m.METHOD_NAME;
                        const acc = m.account_number || m.ACCOUNT_NUMBER;
                        return `<option value="${id}">${name} - رقم: ${acc}</option>`;
                    }).join('');
                }
            } catch (e) {
                walletSelect.innerHTML = '<option value="">خطأ في تحميل المحافظ</option>';
            }
        }

        // دالة الضغط والتحويل النصي المحلية للسند
        function processImageCompressed(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        const scaleFactor = MAX_WIDTH / img.width;
                        
                        if (scaleFactor < 1) {
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleFactor;
                        } else {
                            canvas.width = img.width;
                            canvas.height = img.height;
                        }

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.4));
                    };
                    img.onerror = err => reject(err);
                };
                reader.onerror = err => reject(err);
            });
        }

        async function submitDeposit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const walletId = document.getElementById('walletSelect').value;
            const amountLocal = parseFloat(document.getElementById('amountLocalInput').value);
            const proofFile = document.getElementById('proofInput').files[0];

            if (!walletId || isNaN(amountLocal) || amountLocal <= 0 || !proofFile) {
                alert('يرجى ملء جميع الحقول وارفاق صورة إثبات التحويل!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري معالجة السند وإرسال الطلب...';

            try {
                const proofBase64 = await processImageCompressed(proofFile);
                const netUsdt = parseFloat((amountLocal / currentBuyRate).toFixed(2));

                const payload = {
                    "user_id": parseInt(currentUser.id || currentUser.ID),
                    "local_payment_method_id": parseInt(walletId),
                    "amount_local": amountLocal,
                    "amount_usdt": netUsdt,
                    "net_usdt": netUsdt,
                    "transaction_proof": proofBase64,
                    "status": "PENDING"
                };

                const res = await fetch(`${API_BASE}/deposits/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('✅ تم إرسال طلب الإيداع والسند بنجاح!');
                    window.location.href = 'dashboard.html';
                } else {
                    const errTxt = await res.text();
                    console.error('Oracle Error:', errTxt);
                    alert('❌ تعذر إرسال الطلب، تأكد من إعدادات أوراكل.');
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('حدث خطأ أثناء الاتصال بالسيرفر.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال طلب الإيداع';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadExchangeRate();
            loadWallets();
            document.getElementById('amountLocalInput').addEventListener('input', calculateNetUsdt);
        });
    </script>
</body>
</html>
