<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - إيداع أموال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #10b981; }
        .btn-emerald { background: #10b981; color: white; font-weight: bold; padding: 14px; border-radius: 12px; width: 100%; transition: opacity 0.2s; }
        .btn-emerald:hover { opacity: 0.9; }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto min-h-screen flex flex-col justify-center space-y-6">

    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-wallet"></i> إيداع رصيد جديد
        </h1>
        <a href="dashboard.html" class="text-xs text-slate-300 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 transition">
            <i class="fa-solid fa-arrow-right"></i> رجوع
        </a>
    </div>

    <div class="glass-card p-6 md:p-8 space-y-5 shadow-2xl">
        <form onsubmit="submitDeposit(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">طريقة الإيداع</label>
                <select id="depositMethod" class="input-field font-bold text-emerald-400" required>
                    <option value="USDT TRC20">USDT (TRC20)</option>
                    <option value="USDT BEP20">USDT (BEP20)</option>
                    <option value="بنك الكريمي">بنك الكريمي</option>
                    <option value="جوالي">جوالي / صرافة محلية</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">المبلغ المراد إيداعه (USDT)</label>
                <input type="number" step="0.01" min="1" id="depositAmount" required class="input-field text-left font-mono text-lg text-emerald-400" placeholder="0.00" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">رقم الحوالة أو معرف الإيصال (TxID)</label>
                <input type="text" id="txId" required class="input-field text-left font-mono" placeholder="أدخل رقم العملية أو المعرف" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-200 mb-2">إرفاق إثبات التحويل (صورة الإيصال)</label>
                <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:border-emerald-500 rounded-xl p-4 text-center text-sm text-slate-300 flex items-center justify-center gap-2 transition block">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-lg"></i>
                    <span id="fileNameDisplay">اختر صورة الإيصال من الهاتف أو الكمبيوتر...</span>
                    <input type="file" id="proofFile" accept="image/*" required class="hidden" onchange="updateFileName(this)">
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-emerald flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> تأكيد طلب الإيداع
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://dnitbzmtbedrgfkmxszp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5MpSpsrOXjHCSRNTllJO8g_twaTzmbf';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = JSON.parse(sessionStorage.getItem('pf_user') || '{}');
        const userId = currentUser.id || currentUser.ID || currentUser.user_id;

        if (!userId) {
            alert('⚠️ يرجى تسجيل الدخول أولاً للمتابعة.');
            window.location.href = 'login.html';
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.innerText = input.files[0].name;
                display.classList.add('text-emerald-400', 'font-bold');
            } else {
                display.innerText = 'اختر صورة الإيصال من الهاتف أو الكمبيوتر...';
                display.classList.remove('text-emerald-400', 'font-bold');
            }
        }

        async function submitDeposit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const method = document.getElementById('depositMethod').value;
            const amount = parseFloat(document.getElementById('depositAmount').value);
            const txId = document.getElementById('txId').value.trim();
            const fileInput = document.getElementById('proofFile');

            if (!fileInput.files || !fileInput.files[0]) {
                alert('❌ يرجى إرفاق صورة إثبات التحويل أولاً!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري رفع الصورة وإرسال الطلب...';

            try {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${userId}_${Date.now()}.${fileExt}`;

                // 1. رفع الصورة إلى Supabase Storage
                const { error: uploadError } = await supabaseClient.storage
                    .from('deposit-proofs')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // 2. الحصول على الرابط العام للصورة
                const { data: publicUrlData } = supabaseClient.storage
                    .from('deposit-proofs')
                    .getPublicUrl(fileName);

                const proofUrl = publicUrlData.publicUrl;

                // 3. إرسال الطلب مع الاعتماد على اسم العمود الصحيح payment_method
                const { error: dbError } = await supabaseClient
                    .from('deposit_requests')
                    .insert([{
                        user_id: parseInt(userId),
                        payment_method: method, // تم التصحيح هنا ليتطابق مع جدول قاعدة البيانات
                        amount_usdt: amount,
                        tx_id: txId,
                        proof_image: proofUrl,
                        status: 'PENDING'
                    }]);

                if (dbError) throw dbError;

                alert('✅ تم رفع الإثبات وإرسال طلب الإيداع بنجاح!');
                window.location.href = 'dashboard.html';

            } catch (err) {
                alert(`❌ حدث خطأ أثناء الرفع: ${err.message || JSON.stringify(err)}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تأكيد طلب الإيداع';
            }
        }
    </script>
</body>
</html>
