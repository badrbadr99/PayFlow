<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - منصة الدفع والتحويلات الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">
    <header class="max-w-6xl mx-auto w-full flex justify-between items-center py-4 border-b border-slate-800">
        <h1 class="text-2xl font-extrabold text-emerald-400">PayFlow</h1>
        <div class="space-x-3 space-x-reverse">
            <a href="login.html" class="px-4 py-2 text-sm font-bold text-slate-300 hover:text-white transition">تسجيل الدخول</a>
            <a href="register.html" class="px-4 py-2 text-sm font-bold bg-emerald-500 text-white rounded-xl hover:bg-emerald-600 transition">إنشاء حساب</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto text-center space-y-8 my-auto py-12">
        <div class="space-y-4">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1.5 rounded-full font-bold">منصة المدفوعات والتحويلات الرقمية الآمنة</span>
            <h2 class="text-4xl md:text-6xl font-black tracking-tight">أرسل واستقبل الأموال بكل سهولة وأمان</h2>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">إدارة أموالك، تحويلات فورية، شحن رصيد، وتوثيق الحسابات بأعلى معايير الحماية والأمان.</p>
        </div>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="register.html" class="px-8 py-4 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 shadow-lg shadow-emerald-500/20 transition flex items-center gap-2">
                <i class="fa-solid fa-rocket"></i> ابدأ الآن مجاناً
            </a>
            <a href="login.html" class="px-8 py-4 bg-slate-800 border border-slate-700 text-slate-200 font-bold rounded-xl hover:bg-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
            </a>
        </div>
    </main>

    <footer class="max-w-6xl mx-auto w-full text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
        جميع الحقوق محفوظة &copy; PayFlow 2026
    </footer>
</body>
</html>
