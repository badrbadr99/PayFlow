<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الملف الشخصي | PayFlow</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="manifest" href="assets/site.webmanifest"><meta name="theme-color" content="#0daa76"><script src="assets/preferences.js"></script><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="assets/config.js" defer></script><script src="assets/icons.js" defer></script><script src="assets/i18n.js" defer></script><script src="assets/app.js" defer></script><script src="assets/profile.js" defer></script></head><body data-page="profile"><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><div class="main-wrap"><header class="topbar" id="topbar"></header><main class="page"><div class="page-head"><div><h2>إعدادات الحساب</h2><p>حدّث بياناتك وتفضيلات العرض والأمان</p></div><a class="btn btn-secondary" href="dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة للحساب</a></div><div class="profile-grid"><section class="card"><header class="card-head"><div><h3><i class="fa-solid fa-user"></i> المعلومات الشخصية</h3><p>بيانات التواصل الظاهرة في حسابك</p></div></header><form class="card-body" id="personalForm"><div class="field"><label for="profileName">الاسم الكامل</label><input class="input" id="profileName" minlength="3" required></div><div class="field"><label for="profileEmail">البريد الإلكتروني</label><input class="input ltr" id="profileEmail" type="email" disabled></div><div class="field"><label for="profilePhone">رقم الهاتف</label><input class="input ltr" id="profilePhone" type="tel" required></div><button class="btn btn-primary btn-block" id="savePersonal" type="submit"><i class="fa-solid fa-floppy-disk"></i> حفظ البيانات</button></form></section><section class="card"><header class="card-head"><div><h3><i class="fa-solid fa-palette"></i> المظهر واللغة</h3><p>اختر الطريقة المناسبة لعرض المنصة</p></div></header><form class="card-body" id="preferencesForm"><div class="field"><label>نمط العرض</label><div class="choice-grid"><label class="choice-card"><input type="radio" name="theme" value="dark"><span class="choice-icon"><i class="fa-solid fa-moon"></i></span><strong>الوضع الليلي</strong></label><label class="choice-card"><input type="radio" name="theme" value="light"><span class="choice-icon"><i class="fa-solid fa-sun"></i></span><strong>الوضع النهاري</strong></label></div></div><div class="field"><label for="profileLanguage">اللغة</label><select class="select" id="profileLanguage"><option value="ar">اللغة العربية</option><option value="en">اللغة الإنجليزية</option></select></div><button class="btn btn-primary btn-block" id="savePreferences" type="submit"><i class="fa-solid fa-floppy-disk"></i> حفظ التفضيلات</button></form></section><section class="card"><header class="card-head"><div><h3><i class="fa-solid fa-key"></i> تغيير كلمة المرور</h3><p>استخدم كلمة مرور قوية لا تستخدمها في موقع آخر</p></div></header><form class="card-body" id="passwordForm"><div class="field"><label for="currentPassword">كلمة المرور الحالية</label><input class="input ltr" id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">كلمة المرور الجديدة</label><input class="input ltr" id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">تأكيد كلمة المرور الجديدة</label><input class="input ltr" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary btn-block" id="savePassword" type="submit"><i class="fa-solid fa-lock"></i> تحديث كلمة المرور</button></form></section></div></main></div></div></body></html>
